        document.getElementById("count").innerHTML = divided([number(state.filtered.length) + (scope.flipsOnly ? " flips shown" : " events shown")]
            .concat(scope.range ? [day(scope.range[0]) + " to " + day(scope.range[1])] : []))
        rowsBox.scrollTop = 0
        drawRows()
        markSourceFamilies()
    }

    const drawRows = () => {
        const first = Math.max(0, Math.floor(rowsBox.scrollTop / ROW_HEIGHT) - 5)
        const visible = Math.ceil(rowsBox.clientHeight / ROW_HEIGHT) + 10
        if (state.filtered.length === 0) {
            rowsInner.innerHTML = "<div class='empty'>Nothing matches those filters</div>"
            return
        }
        const parts = []
        state.filtered.slice(first, first + visible).forEach((event, index) => {
            const top = (first + index) * ROW_HEIGHT
            parts.push("<div class='row' style='top:" + top + "px'>"
                + "<span class='muted'>" + stampCell(event.at) + "</span>"
                + "<span class='" + (event.delta > 0 ? "pos" : event.delta < 0 ? "neg" : "muted") + "'>" + signed(event.delta) + "</span>"
                + "<span" + (event.shown === null ? " class='muted'" : "") + ">" + number(event.balance) + "</span>"
                + "<span>" + labelOf(event) + "</span>"
                + "<span class='muted'>" + (event.command || "—") + "</span>"
                + "<span class='muted'>" + who(event) + "</span>"
                + "<span class='muted'>" + (event.recovered ? "Yes" : "—") + "</span>"
                + "</div>")
        })
        rowsInner.innerHTML = parts.join("")
    }

    rowsBox.onscroll = drawRows
    refreshChips()
    const SOURCE_ORDER = COLOUR_ORDER.concat(["newUser", "unrecorded"])
    const MIN_LUCK_FLIPS = 20
    const LUCK_RANGE = 4
    const LUCK_COVERAGE = ["", "68%", "95%", "99.7%"]
    const LUCK_EVEN_PX = 1
    const LUCK_DRAWN_POINTS = 1200
    const PERIOD_PAD = {left: 56, right: 16, top: 4, bottom: 20}
    const PERIOD_BAR_PX = 4
    const PERIOD_EDGE_PX = 6
    const CONCENTRATION_SAMPLES = 200
    const RANKING_SAMPLES = 60
    const LABELLED_LANES = 10
    const MIN_LABEL_GAP_PX = 14
    const RANK_BUFFER_SHARE = 0.1
    const RANK_TICK_GAP_PX = 46
    const ERA_JOIN_MS = 10 * 60 * 1000
    const ACCENT = "#7aa2f7"
    const CONCENTRATION_BANDS = [
        {size: 10, label: "Top 10", fill: "rgba(122, 162, 247, .16)", stroke: "#5b7fcf"},
        {size: 3, label: "Top 3", fill: "rgba(122, 162, 247, .32)", stroke: "#7aa2f7"},
        {size: 1, label: "Top 1", fill: "rgba(122, 162, 247, .55)", stroke: "#b9cefb"},
    ]

    const hoverAttr = text => escape(text).replace(/'/g, "&#39;")
    const hoverTip = document.getElementById("hoverTip")
    const HOVER_OFFSET_PX = 14
    const HOVER_MARGIN_PX = 8
    const hideHoverTip = () => { hoverTip.style.opacity = "0" }
    document.addEventListener("pointermove", move => {
        const target = move.target instanceof Element ? move.target.closest("[data-hover]") : null
        if (target === null) {
            hideHoverTip()
            return
        }
        hoverTip.textContent = target.getAttribute("data-hover")
        hoverTip.style.opacity = "1"
        const below = move.clientY + HOVER_OFFSET_PX + hoverTip.offsetHeight <= window.innerHeight - HOVER_MARGIN_PX
        const left = Math.min(window.innerWidth - hoverTip.offsetWidth - HOVER_MARGIN_PX, move.clientX + HOVER_OFFSET_PX)
        hoverTip.style.left = Math.max(HOVER_MARGIN_PX, left) + "px"
        hoverTip.style.top = (below ? move.clientY + HOVER_OFFSET_PX : move.clientY - hoverTip.offsetHeight - HOVER_OFFSET_PX) + "px"
    })
    document.addEventListener("pointerout", out => { if (out.relatedTarget === null) hideHoverTip() })
    const memberIndex = person => Number(person.key)
    const selectedMembers = () => state.mode === "person" ? [state.person]
        : state.mode === "some" ? chosenMembers()
        : state.mode === "top" ? topMembers()
        : people
    const singleSubject = () => state.mode === "person" || state.mode === "server"
    const setHead = (view, title, text) => {
        document.getElementById(view + "Title").innerHTML = title
        document.getElementById(view + "Text").textContent = text
    }
    const percent = share => share === 0 ? "0%" : (share < .1 ? (share * 100).toFixed(1) : Math.round(share * 100)) + "%"

    const shownLists = new Map()
    const shownList = (name, person, keep) => {
        const id = name + viewKey()
        if (!shownLists.has(id)) shownLists.set(id, new Map())
        const byPerson = shownLists.get(id)
        if (!byPerson.has(person)) byPerson.set(person, person.list.filter(event => !isHidden(event) && keep(event)))
        return byPerson.get(person)
    }
    const flipsOf = person => shownList("flips", person, event => event.reason === "flip" && event.delta !== 0)
    const changesOf = person => shownList("changes", person, event => event.reason !== "openingBalance" && event.delta !== 0)
    const periodSpans = new Map()
    const periodSpanOf = () => {
        const key = viewKey()
        if (!periodSpans.has(key)) {
            periodSpans.set(key, people.reduce((span, person) => changesOf(person).reduce((known, event) => known === null
                ? [event.at, event.at] : [Math.min(known[0], event.at), Math.max(known[1], event.at)], span), null))
        }
        return periodSpans.get(key)
    }
    const inPeriod = event => state.period === null || (event.at >= state.period[0] && event.at <= state.period[1])
    const PERIOD_STRIPS = {
        luck: {eventsOf: flipsOf, every: "Measuring every flip, ", some: "Measuring flips from "},
        sources: {eventsOf: changesOf, every: "Adding up every point, ", some: "Adding up points from "},
    }

    const setPeriod = period => {
        if (sameRange(state.period, period)) return
        state.period = period
        state.ranges.luck = null
        luckTracks.clear()
        drawActiveView()
    }

    const drawPeriodStrip = key => {
        const strip = PERIOD_STRIPS[key]
        const periodSpan = periodSpanOf()
        const box = document.getElementById(key + "Period")
        box.hidden = periodSpan === null
        if (periodSpan === null) return

        const svg = document.getElementById(key + "PeriodChart")
        const readout = document.getElementById(key + "PeriodReadout")
        const pad = PERIOD_PAD
        const whole = [periodSpan[0], Math.max(periodSpan[0] + 1, periodSpan[1])]
        const stored = state.periodViews[key]
        const held = stored ? [Math.max(whole[0], stored[0]), Math.min(whole[1], stored[1])] : null
        const view = held && held[1] - held[0] >= MIN_SPAN_MS ? held : whole
        const from = view[0]
        const to = view[1]
        const width = svg.parentElement.clientWidth || 900
        const height = svg.parentElement.clientHeight || 56
        const plotWidth = Math.max(1, width - pad.left - pad.right)
        const floor = height - pad.bottom
        const toX = time => pad.left + (time - from) / (to - from) * plotWidth
        const svgX = clientX => {
            const frame = svg.getBoundingClientRect()
            return (clientX - frame.left) / frame.width * width
        }
        const timeAt = x => from + (x - pad.left) / plotWidth * (to - from)
        const clampTime = time => Math.min(to, Math.max(from, time))

        const buckets = new Array(Math.max(1, Math.floor(plotWidth / PERIOD_BAR_PX))).fill(0)
        selectedMembers().forEach(person => strip.eventsOf(person).forEach(event => {
            if (event.at < from || event.at > to) return
            buckets[Math.min(buckets.length - 1, Math.floor((event.at - from) / (to - from) * buckets.length))]++
        }))
        const tallest = Math.max(1, ...buckets)
        const slot = plotWidth / buckets.length
        const bucketSpan = (to - from) / buckets.length
        const ticks = timeTicks(from, to, Math.max(3, Math.round(plotWidth / 130))).ticks.map(tick => {
            const x = toX(tick.at).toFixed(1)
            return "<line class='grid' x1='" + x + "' x2='" + x + "' y1='" + floor + "' y2='" + (floor + 4) + "'></line>"
                + "<text class='axis' text-anchor='middle' x='" + x + "' y='" + (height - 5) + "'>" + tick.label + "</text>"
        }).join("")

        const render = period => {
            const picked = period || [from, to]
            const bars = buckets.map((count, index) => {
                if (!count) return ""
                const start = from + index * bucketSpan
                const tall = Math.max(1.5, Math.sqrt(count / tallest) * (floor - pad.top))
                const inside = start + bucketSpan >= picked[0] && start <= picked[1]
                return "<rect x='" + (pad.left + index * slot).toFixed(1) + "' y='" + (floor - tall).toFixed(1) + "' width='" + Math.max(1, slot - 1).toFixed(1)
                    + "' height='" + tall.toFixed(1) + "' fill='" + (inside ? ACCENT : "rgba(154, 161, 177, .3)") + "'></rect>"
            }).join("")
            let chosen = ""
            if (period && period[1] >= from && period[0] <= to) {
                const edge = pad.left + plotWidth
                const left = Math.min(edge, Math.max(pad.left, toX(period[0])))
                const right = Math.min(edge, Math.max(pad.left, toX(period[1])))
                const middle = (pad.top + floor) / 2
                const handle = x => "<rect x='" + (x - 2).toFixed(1) + "' y='" + (middle - 8).toFixed(1) + "' width='4' height='16' rx='1.5' fill='" + ACCENT + "'></rect>"
                chosen = "<rect x='" + left.toFixed(1) + "' y='" + pad.top + "' width='" + Math.max(1, right - left).toFixed(1) + "' height='" + (floor - pad.top)
                    + "' fill='rgba(122, 162, 247, .12)' stroke='" + ACCENT + "'></rect>"
                    + (period[0] >= from ? handle(left) : "") + (period[1] <= to ? handle(right) : "")
            }
            svg.setAttribute("viewBox", "0 0 " + width + " " + height)
            svg.innerHTML = ticks + horizontal(pad, width, floor) + bars + chosen
            readout.innerHTML = period
                ? strip.some + "<span class='periodPicked'>" + longDay(period[0]) + " to " + longDay(period[1]) + "</span>"
                : strip.every + longDay(whole[0]) + " to " + longDay(whole[1])
        }
        render(state.period)

        const grabOf = x => {
            const period = state.period
            if (period === null) return "new"
            const left = toX(period[0])
            const right = toX(period[1])
            if (Math.abs(x - left) <= PERIOD_EDGE_PX) return "start"
            if (Math.abs(x - right) <= PERIOD_EDGE_PX) return "end"
            return x > left && x < right ? "move" : "new"
        }
        const snapped = period => {
            const start = new Date(period[0])
            start.setHours(0, 0, 0, 0)
            const end = new Date(period[1])
            if (end.getHours() || end.getMinutes() || end.getSeconds() || end.getMilliseconds()) {
                end.setHours(0, 0, 0, 0)
                end.setDate(end.getDate() + 1)
            }
            const snap = [Math.max(from, start.getTime()), Math.min(to, end.getTime() - 1)]
            return snap[0] <= whole[0] && snap[1] >= whole[1] ? null : snap
        }

        let drag = null
        svg.onpointerdown = down => {
            if (down.pointerType === "mouse" && down.button !== 0) return
            svg.setPointerCapture(down.pointerId)
            const x = svgX(down.clientX)
            drag = {grab: grabOf(x), x: x, period: state.period, preview: state.period, moved: false}
            if (drag.grab === "move") svg.style.cursor = "grabbing"
        }
        svg.onpointermove = move => {
            const x = svgX(move.clientX)
            if (drag === null) {
                const grab = grabOf(x)
                svg.style.cursor = grab === "start" || grab === "end" ? "ew-resize" : grab === "move" ? "grab" : ""
                return
            }
            if (!drag.moved && Math.abs(x - drag.x) <= TAP_SLOP_PX) return
            drag.moved = true
            const at = clampTime(timeAt(x))
            if (drag.grab === "move") {
                const length = drag.period[1] - drag.period[0]
                const start = Math.min(to - length, Math.max(from, drag.period[0] + (x - drag.x) / plotWidth * (to - from)))
                drag.preview = [start, start + length]
            } else {
                const anchor = drag.grab === "start" ? drag.period[1] : drag.grab === "end" ? drag.period[0] : clampTime(timeAt(drag.x))
                drag.preview = [Math.min(anchor, at), Math.max(anchor, at)]
            }
            render(drag.preview)
        }
        const release = () => {
            if (drag === null) return
            const finished = drag
            drag = null
            svg.style.cursor = ""
            if (!finished.moved) return
            if (finished.preview === null || finished.preview[1] - finished.preview[0] < MIN_SPAN_MS) {
                render(state.period)
                return
            }
            const period = snapped(finished.preview)
            if (sameRange(state.period, period)) render(period)
            else setPeriod(period)
        }
        svg.onpointerup = release
        svg.onpointercancel = release
        svg.onpointerleave = () => {
            if (drag === null) svg.style.cursor = ""
        }
        svg.ondblclick = () => {
            state.periodViews[key] = null
            if (state.period === null) drawPeriodStrip(key)
            else setPeriod(null)
        }

        const placeView = (start, length) => {
            const at = Math.min(whole[1] - length, Math.max(whole[0], start))
            return at <= whole[0] && at + length >= whole[1] ? null : [at, at + length]
        }
        const setPeriodView = next => {
            if (sameRange(state.periodViews[key] || null, next)) return
            state.periodViews[key] = next
            drawPeriodStrip(key)
        }
        svg.onwheel = wheel => {
            wheel.preventDefault()
            const unit = wheel.deltaMode === 1 ? LINE_PX : wheel.deltaMode === 2 ? height : 1
            const sideways = wheel.shiftKey && !wheel.deltaX
            const across = (sideways ? wheel.deltaY : wheel.deltaX) * unit
            const along = (sideways ? 0 : wheel.deltaY) * unit
            const length = to - from

            if (Math.abs(across) > Math.abs(along)) {
                setPeriodView(placeView(from + across * length / plotWidth, length))
                return
            }

            const speed = wheel.ctrlKey ? PINCH_ZOOM_SPEED : ZOOM_SPEED
            const change = Math.max(-MAX_ZOOM_PER_EVENT, Math.min(MAX_ZOOM_PER_EVENT, along * speed))
            const next = Math.min(whole[1] - whole[0], Math.max(MIN_SPAN_MS, length * Math.exp(change)))
            const focus = clampTime(timeAt(svgX(wheel.clientX)))
            setPeriodView(placeView(focus - (focus - from) / Math.max(1, length) * next, next))
        }

        document.querySelectorAll("#" + key + "PeriodPresets [data-range]").forEach(button => {
            const length = PRESETS[button.dataset.range]
            const current = state.period
            const on = length === null
                ? current === null
                : current !== null && length < whole[1] - whole[0]
                    && Math.abs(current[1] - whole[1]) < PRESET_TOLERANCE_MS
                    && Math.abs(current[1] - current[0] - length) < PRESET_TOLERANCE_MS
            button.className = on ? "tool on" : "tool"
            button.onclick = () => setPeriod(length === null || length >= whole[1] - whole[0] ? null : [whole[1] - length, whole[1]])
        })
    }

    const sourceTotals = person => {
        const totals = new Map()
        changesOf(person).forEach(event => {
            if (!inPeriod(event)) return
            const family = colourKey(reasonOf(event))
            totals.set(family, (totals.get(family) || 0) + shownAmount(event))
        })
        return totals
    }
    const sourceRank = family => {
        const at = SOURCE_ORDER.indexOf(family)
        return at === -1 ? SOURCE_ORDER.length : at
    }
    const swatch = family => family === "unrecorded"
        ? "<i class='unknown'></i>"
        : "<i style='background:" + colourFor(family) + "'></i>"
    const familyReasons = family => Array.from(reasonChips.keys())
        .filter(reason => colourKey(reason) === family && reasonChips.get(reason).style.display !== "none")
    const familyAttr = family => " data-source='" + family + "'" + (familyReasons(family).length ? " data-family='" + family + "'" : "")
    const showFamily = family => {
        const wanted = familyReasons(family)
        if (wanted.length === 0) return
        const already = wanted.length === state.reasons.size && wanted.every(reason => state.reasons.has(reason))
        state.reasons.clear()
        if (!already) wanted.forEach(reason => state.reasons.add(reason))
        reasonChips.forEach((chip, reason) => { chip.className = state.reasons.has(reason) ? "chip on" : "chip" })
        applyFilters()
    }
    const markSourceFamilies = () => {
        const chosen = new Set(Array.from(state.reasons).map(colourKey))
        document.querySelectorAll("#sourcesRows [data-source], #sourcesLegend [data-source]").forEach(element => {
            element.classList.toggle("dim", chosen.size > 0 && !chosen.has(element.dataset.source))
        })
    }
    const sourceSegment = ([family, value], scale) => "<div" + familyAttr(family) + " class='srcSeg" + (family === "unrecorded" ? " unknown" : "")
        + "' style='flex: 0 0 " + (Math.abs(value) / Math.max(1, scale) * 100).toFixed(3) + "%"
        + (family === "unrecorded" ? "" : "; background:" + colourFor(family))
        + "' data-hover='" + hoverAttr(labelFor(family) + ": " + signed(value)) + "'></div>"

    let sourcesScale = "member"

    const drawSourceBreakdown = () => {
        const totals = new Map()
        const members = state.mode === "person" ? [state.person] : people
        members.forEach(person => sourceTotals(person).forEach((value, family) => {
            totals.set(family, (totals.get(family) || 0) + value)
        }))
        const entries = Array.from(totals)
            .filter(([, value]) => value !== 0)
            .sort((a, b) => sourceRank(a[0]) - sourceRank(b[0]) || a[0].localeCompare(b[0]))
        const rows = document.getElementById("sourcesRows")
        if (entries.length === 0) {
            rows.innerHTML = "<div class='muted'>" + (state.period === null ? "Nothing to break down yet." : "Nothing changed in this period.") + "</div>"
            return
        }

        const reach = Math.max(1, ...entries.map(([, value]) => Math.abs(value)))
        const net = entries.reduce((sum, [, value]) => sum + value, 0)
        rows.innerHTML = entries.map(([family, value]) => {
            const bar = sourceSegment([family, value], reach)
            return "<div class='srcRow'>"
                + "<div class='srcName'" + familyAttr(family) + ">" + swatch(family) + labelFor(family) + "</div>"
                + "<div class='srcBar' style='grid-template-columns: 50% 50%'>"
                + "<div class='srcSide loss'>" + (value < 0 ? bar : "") + "</div>"
                + "<div class='srcSide'>" + (value > 0 ? bar : "") + "</div>"
                + "</div>"
                + "<div class='srcNet'>" + toned(signed(value)) + "</div>"
                + "</div>"
        }).join("")
            + "<div class='srcRow total'><div class='srcName'>Net change</div><div></div><div class='srcNet'>" + toned(signed(net)) + "</div></div>"
    }

    const drawSourceView = () => {
        drawPeriodStrip("sources")
        const single = singleSubject()
        document.getElementById("sourcesTools").hidden = single
        if (state.mode === "person") {
            setHead("sources", "Where " + nameHtml(state.person) + "'s points came from",
                "Net points from each source. Gains run right of the line and losses run left. Hover a bar for the exact amount, and click a source to list its events below.")
        } else if (state.mode === "server") {
            setHead("sources", "Where the server's points came from",
                "Every member's changes added together, by source. Gains run right of the line and losses run left. Click a source to list its events below.")
        } else {
            setHead("sources", state.mode === "some" ? "Where points came from: " + chosenTitle()
                : state.mode === "top" ? "Where points came from: top " + topMembers().length + " by " + topPhrase() : "Where points came from",
                "Each member's net change from every source. Gains run right of the line and losses run left, so two members with the same balance can show very different stories. Per member scales every bar to its own member, so the mix is readable for everyone; Shared puts everyone on one scale to compare size. Click a source to list its events below.")
        }
        if (single) {
            drawSourceBreakdown()
            return
        }

        const rows = selectedMembers()
            .map(person => ({person: person, totals: sourceTotals(person)}))
            .filter(row => Array.from(row.totals.values()).some(value => value !== 0))
            .sort((a, b) => b.person.last - a.person.last)
        if (rows.length === 0) {
            document.getElementById("sourcesRows").innerHTML = "<div class='muted'>" + (state.period === null ? "Nothing to break down yet." : "Nothing changed in this period.") + "</div>"
            document.getElementById("sourcesLegend").innerHTML = ""
            return
        }

        const sideOf = (row, gaining) => Array.from(row.totals)
            .filter(([, value]) => gaining ? value > 0 : value < 0)
            .sort((a, b) => sourceRank(a[0]) - sourceRank(b[0]))
        const sumOf = (row, gaining) => sideOf(row, gaining).reduce((sum, [, value]) => sum + Math.abs(value), 0)
        const shared = sourcesScale === "shared"
        const most = {
            gain: Math.max(0, ...rows.map(row => sumOf(row, true))),
            loss: Math.max(0, ...rows.map(row => sumOf(row, false))),
        }
        const span = Math.max(1, most.gain + most.loss)
        const columns = shared
            ? (most.loss / span * 100).toFixed(3) + "% " + (most.gain / span * 100).toFixed(3) + "%"
            : "50% 50%"

        document.getElementById("sourcesRows").innerHTML = rows.map(row => {
            const net = Array.from(row.totals.values()).reduce((sum, value) => sum + value, 0)
            const own = Math.max(sumOf(row, true), sumOf(row, false))
            return "<div class='srcRow'>"
                + "<div class='srcName'>" + who(row.person) + "</div>"
                + "<div class='srcBar' style='grid-template-columns: " + columns + "'>"
                + "<div class='srcSide loss'>" + sideOf(row, false).reverse().map(entry => sourceSegment(entry, shared ? most.loss : own)).join("") + "</div>"
                + "<div class='srcSide'>" + sideOf(row, true).map(entry => sourceSegment(entry, shared ? most.gain : own)).join("") + "</div>"
                + "</div>"
                + "<div class='srcNet'>" + toned(signed(net)) + "</div>"
                + "</div>"
        }).join("")

        const present = new Set()
        rows.forEach(row => row.totals.forEach((value, family) => { if (value !== 0) present.add(family) }))
        document.getElementById("sourcesLegend").innerHTML = Array.from(present)
            .sort((a, b) => sourceRank(a) - sourceRank(b) || a.localeCompare(b))
            .map(family => "<span" + familyAttr(family) + ">" + swatch(family) + labelFor(family) + "</span>").join("")
    }
    const drawSources = () => {
        drawSourceView()
        markSourceFamilies()
    }
    document.getElementById("sourcesRows").onclick = event => {
        const target = event.target.closest("[data-family]")
        if (target) showFamily(target.dataset.family)
    }
    document.getElementById("sourcesLegend").onclick = document.getElementById("sourcesRows").onclick

    const luckOf = person => {
        let net = 0
        let variance = 0
        let wins = 0
        let losses = 0
        flipsOf(person).forEach(event => {
            if (!inPeriod(event)) return
            net += event.delta
            variance += event.delta * event.delta
            if (event.delta > 0) wins++
            else losses++
        })
        return {flips: wins + losses, wins: wins, losses: losses, net: net, z: variance ? net / Math.sqrt(variance) : 0}
    }
    const verdict = z => z > 2 ? "Very lucky" : z > 1 ? "Lucky" : z >= -1 ? "About even" : z >= -2 ? "Unlucky" : "Very unlucky"
    const sigmas = z => {
        const tenths = Math.round(z * 10)
        return (tenths > 0 ? "+" : tenths < 0 ? "-" : "") + Math.abs(tenths / 10).toFixed(1) + "\u03c3"
    }

    const timeAxis = (from, to, width, height, pad) => {
        const toX = time => pad.left + (time - from) / Math.max(1, to - from) * (width - pad.left - pad.right)
        const markup = timeTicks(from, to, Math.max(3, Math.round((width - pad.left - pad.right) / 130))).ticks.map(tick => {
            const x = toX(tick.at).toFixed(1)
            return "<line class='vgrid' x1='" + x + "' x2='" + x + "' y1='" + pad.top + "' y2='" + (height - pad.bottom) + "'></line>"
                + "<text class='axis' text-anchor='middle' x='" + x + "' y='" + (height - 6) + "'>" + tick.label + "</text>"
        }).join("")
        return {toX: toX, markup: markup}
    }
    const sampleAt = (svg, clientX, width, pad, count) => {
        const box = svg.getBoundingClientRect()
        const x = (clientX - box.left) / box.width * width
        const ratio = (x - pad.left) / Math.max(1, width - pad.left - pad.right)
        return Math.max(0, Math.min(count - 1, Math.round(ratio * (count - 1))))
    }
    const moveHair = (id, x) => {
        const hair = document.getElementById(id)
        hair.setAttribute("x1", x)
        hair.setAttribute("x2", x)
        hair.style.opacity = "1"
    }
    const hideHair = id => {
        const hair = document.getElementById(id)
        if (hair) hair.style.opacity = "0"
    }
    const hairLine = (id, pad, height) => "<line id='" + id + "' class='grid' y1='" + pad.top + "' y2='" + (height - pad.bottom) + "' style='opacity:0'></line>"
    const horizontal = (pad, width, y) => "<line class='grid' x1='" + pad.left + "' x2='" + (width - pad.right) + "' y1='" + y + "' y2='" + y + "'></line>"
    const leftLabel = (pad, y, text) => "<text class='axis' text-anchor='end' x='" + (pad.left - 8) + "' y='" + (Number(y) + 4) + "'>" + text + "</text>"
    const clipTo = (id, pad, width, height) => "<defs><clipPath id='" + id + "'><rect x='" + pad.left + "' y='" + pad.top
        + "' width='" + Math.max(0, width - pad.left - pad.right) + "' height='" + Math.max(0, height - pad.top - pad.bottom) + "'></rect></clipPath></defs>"

    const lastAtOrBefore = (points, time) => {
        let low = 0
        let high = points.length - 1
        let found = -1
        while (low <= high) {
            const middle = (low + high) >> 1
            if (points[middle].t <= time) {
                found = middle
                low = middle + 1
            } else {
                high = middle - 1
            }
        }
        return found
    }

    const gestures = {}
    const heldScales = {}
    const gestureOf = key => gestures[key]
        || (gestures[key] = {pointers: new Map(), panning: null, pinching: null, dragFrom: null, wheelHold: false, wheelTimer: null})
    const holdingScale = key => {
        const gesture = gestureOf(key)
        return (gesture.panning !== null && gesture.panning.moved) || gesture.wheelHold
    }
    const sameRange = (a, b) => (a || null) === (b || null) || (Boolean(a) && Boolean(b) && a[0] === b[0] && a[1] === b[1])

    const detachNavigation = (svg, key) => {
        svg.onpointerdown = null
        svg.onpointermove = null
        svg.onpointerup = null
        svg.onpointercancel = null
        svg.onpointerleave = null
        svg.onwheel = null
        svg.ondblclick = null
        document.getElementById(key + "Range").textContent = ""
    }

    const attachNavigation = ({key, svg, whole, width, height, pad, redraw, hover, leave}) => {
        const gesture = gestureOf(key)
        const span = state.ranges[key] || whole
        const plotWidth = Math.max(1, width - pad.left - pad.right)
        const svgX = clientX => {
            const box = svg.getBoundingClientRect()
            return (clientX - box.left) / box.width * width
        }
        const timeAt = clientX => span[0] + (svgX(clientX) - pad.left) / plotWidth * (span[1] - span[0])
        const place = (from, length) => {
            if (length >= whole[1] - whole[0]) return null
            if (from < whole[0]) from = whole[0]
            if (from + length > whole[1]) from = whole[1] - length
            return [from, from + length]
        }
        const setRange = range => {
            if (sameRange(state.ranges[key], range)) return
            state.ranges[key] = range
            redraw()
        }
        const bandId = key + "Band"
        svg.insertAdjacentHTML("beforeend", "<rect id='" + bandId + "' y='" + pad.top + "' height='" + Math.max(0, height - pad.top - pad.bottom)
            + "' fill='" + ACCENT + "' opacity='0.2' style='display:none'></rect>")
        const band = () => document.getElementById(bandId)
        const settle = () => {
            if (activeView === key) drawActiveView()
        }

        svg.onpointerdown = down => {
            if (down.pointerType === "mouse" && down.button !== 0) return
            svg.setPointerCapture(down.pointerId)
            gesture.pointers.set(down.pointerId, {x: down.clientX, y: down.clientY})

            if (gesture.pointers.size === 2) {
                const [a, b] = Array.from(gesture.pointers.values())
                const focus = timeAt((a.x + b.x) / 2)
                gesture.panning = null
                svg.style.cursor = ""
                gesture.pinching = {
                    distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
                    focus: focus,
                    ratio: (focus - span[0]) / Math.max(1, span[1] - span[0]),
                    length: span[1] - span[0],
                }
                leave()
                return
            }
            if (gesture.pointers.size > 2) return

            if (down.shiftKey) {
                gesture.dragFrom = {x: svgX(down.clientX), at: timeAt(down.clientX)}
                const rect = band()
                rect.setAttribute("x", gesture.dragFrom.x)
                rect.setAttribute("width", "0")
                rect.style.display = ""
                return
            }
            gesture.panning = {clientX: down.clientX, from: span[0], length: span[1] - span[0], moved: false}
        }

        svg.onpointermove = move => {
            if (gesture.pointers.has(move.pointerId)) gesture.pointers.set(move.pointerId, {x: move.clientX, y: move.clientY})

            if (gesture.pinching !== null) {
                if (gesture.pointers.size < 2) return
                const [a, b] = Array.from(gesture.pointers.values())
                const distance = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y))
                const length = Math.min(whole[1] - whole[0], Math.max(MIN_SPAN_MS, gesture.pinching.length * gesture.pinching.distance / distance))
                setRange(place(gesture.pinching.focus - gesture.pinching.ratio * length, length))
                return
            }

            if (gesture.panning !== null) {
                if (!gesture.panning.moved) {
                    if (Math.abs(move.clientX - gesture.panning.clientX) <= TAP_SLOP_PX) return
                    gesture.panning.moved = true
                    svg.style.cursor = "grabbing"
                    leave()
                }
                setRange(place(gesture.panning.from + (gesture.panning.clientX - move.clientX) * gesture.panning.length / plotWidth, gesture.panning.length))
                return
            }

            if (gesture.dragFrom !== null) {
                const x = svgX(move.clientX)
                const rect = band()
                rect.setAttribute("x", Math.min(x, gesture.dragFrom.x))
                rect.setAttribute("width", Math.abs(x - gesture.dragFrom.x))
            }
            if (move.pointerType === "mouse") hover(move.clientX)
        }

        const release = up => {
            gesture.pointers.delete(up.pointerId)

            if (gesture.pinching !== null) {
                if (gesture.pointers.size < 2) gesture.pinching = null
                return
            }

            if (gesture.panning !== null) {
                const moved = gesture.panning.moved
                gesture.panning = null
                svg.style.cursor = ""
                if (moved) settle()
                else if (up.pointerType !== "mouse" && up.type === "pointerup") hover(up.clientX)
                return
            }

            if (gesture.dragFrom === null) return
            const from = Math.min(gesture.dragFrom.at, timeAt(up.clientX))
            const to = Math.max(gesture.dragFrom.at, timeAt(up.clientX))
            gesture.dragFrom = null
            band().style.display = "none"
            if (to - from < MIN_SPAN_MS) return
            setRange([from, to])
        }
        svg.onpointerup = release
        svg.onpointercancel = release
        svg.onpointerleave = event => {
            if (event.pointerType === "mouse" && gesture.panning === null && gesture.pinching === null) leave()
        }

        svg.onwheel = wheel => {
            wheel.preventDefault()
            const unit = wheel.deltaMode === 1 ? LINE_PX : wheel.deltaMode === 2 ? height : 1
            const sideways = wheel.shiftKey && !wheel.deltaX
            const across = (sideways ? wheel.deltaY : wheel.deltaX) * unit
            const along = (sideways ? 0 : wheel.deltaY) * unit
            const length = span[1] - span[0]
            gesture.dragFrom = null
            band().style.display = "none"

            if (Math.abs(across) > Math.abs(along)) {
                gesture.wheelHold = true
                clearTimeout(gesture.wheelTimer)
                gesture.wheelTimer = setTimeout(() => {
                    gesture.wheelHold = false
                    settle()
                }, WHEEL_SETTLE_MS)
                setRange(place(span[0] + across * length / plotWidth, length))
                return
            }
            gesture.wheelHold = false
            clearTimeout(gesture.wheelTimer)
            const speed = wheel.ctrlKey ? PINCH_ZOOM_SPEED : ZOOM_SPEED
            const change = Math.max(-MAX_ZOOM_PER_EVENT, Math.min(MAX_ZOOM_PER_EVENT, along * speed))
            const next = Math.min(whole[1] - whole[0], Math.max(MIN_SPAN_MS, length * Math.exp(change)))
            const focus = Math.min(span[1], Math.max(span[0], timeAt(wheel.clientX)))
            setRange(place(focus - (focus - span[0]) / Math.max(1, length) * next, next))
        }
        svg.ondblclick = () => setRange(null)

        document.querySelectorAll("#" + key + "Presets [data-range]").forEach(button => {
            const length = PRESETS[button.dataset.range]
            const current = state.ranges[key] || null
            const on = length === null
                ? current === null
                : current !== null && length < whole[1] - whole[0]
                    && Math.abs(current[1] - whole[1]) < PRESET_TOLERANCE_MS
                    && Math.abs(current[1] - current[0] - length) < PRESET_TOLERANCE_MS
            button.className = on ? "tool on" : "tool"
            button.onclick = () => setRange(length === null || length >= whole[1] - whole[0] ? null : [whole[1] - length, whole[1]])
        })
        document.getElementById(key + "Range").textContent = state.ranges[key] ? rangeLabel(span[0], span[1]) : ""
    }

    const luckTracks = new Map()
    const luckTrackOf = () => {
        const id = state.mode === "person" ? "member" + state.person.key : "server"
        if (luckTracks.has(id)) return luckTracks.get(id)
        const flips = (state.mode === "person" ? [state.person] : people)
            .flatMap(person => flipsOf(person).filter(inPeriod))
            .sort((a, b) => a.at - b.at)
        let net = 0
        let variance = 0
        let wins = 0
        const track = flips.map((event, index) => {
            net += event.delta
            variance += event.delta * event.delta
            if (event.delta > 0) wins++
            return {t: event.at, net: net, spread: Math.sqrt(variance), count: index + 1}
        })
        const result = {track: track, wins: wins}
        luckTracks.set(id, result)
        return result
    }

    const drawLuckTimeline = () => {
        const svg = document.getElementById("luckChart")
        const readout = document.getElementById("luckReadout")
        const legend = document.getElementById("luckLegend")
        const {track, wins} = luckTrackOf()
        if (track.length < MIN_LUCK_FLIPS) {
            detachNavigation(svg, "luck")
            svg.innerHTML = ""
            legend.innerHTML = ""
            const when = state.period === null ? " so far" : " in this period"
            readout.textContent = track.length === 0 ? (state.period === null ? "No flips yet." : "No flips in this period.")
                : "Only " + track.length + (track.length === 1 ? " flip" : " flips") + when + ", too few to judge."
            return
        }

        const last = track[track.length - 1]
        const whole = [track[0].t, Math.max(track[0].t + 1, last.t)]
        const span = state.ranges.luck || whole
        const first = Math.max(0, lastAtOrBefore(track, span[0]))
        const end = Math.min(track.length - 1, lastAtOrBefore(track, span[1]) + 1)
        const inView = track.slice(first, end + 1)
        const every = Math.max(1, Math.ceil(inView.length / LUCK_DRAWN_POINTS))
        const drawn = inView.filter((point, index) => index % every === 0 || index === inView.length - 1)

        const width = svg.parentElement.clientWidth || 900
        const height = svg.parentElement.clientHeight || 460
        const pad = {left: 56, right: 16, top: 12, bottom: 24}
        const axis = timeAxis(span[0], span[1], width, height, pad)
        const fitted = Math.max(1, 3 * drawn[drawn.length - 1].spread, ...drawn.map(point => Math.abs(point.net))) * 1.08
        const reach = holdingScale("luck") && heldScales.luck ? Math.max(heldScales.luck, fitted) : fitted
        heldScales.luck = reach
        const toY = value => pad.top + (reach - value) / (2 * reach) * (height - pad.top - pad.bottom)
        const step = niceStep(2 * reach, Math.max(4, Math.round((height - pad.top - pad.bottom) / 70)))

        let grid = ""
        for (let value = Math.ceil(-reach / step) * step; value <= reach; value += step) {
            const y = toY(value).toFixed(1)
            grid += horizontal(pad, width, y) + leftLabel(pad, y, short(Math.abs(value) < step / 2 ? 0 : value))
        }
        const band = sigmaWidth => drawn.map((point, index) => (index ? "L" : "M") + axis.toX(point.t).toFixed(1) + " " + toY(sigmaWidth * point.spread).toFixed(1)).join(" ")
            + " " + drawn.slice().reverse().map(point => "L" + axis.toX(point.t).toFixed(1) + " " + toY(-sigmaWidth * point.spread).toFixed(1)).join(" ") + " Z"
        const line = drawn.map((point, index) => (index ? "L" : "M") + axis.toX(point.t).toFixed(1) + " " + toY(point.net).toFixed(1)).join(" ")
        const zero = toY(0)
        const lineIn = (colour, clip) => "<path d='" + line + "' fill='none' style='stroke: " + colour + "'" + (clip ? " clip-path='url(#" + clip + ")'" : "")
            + " stroke-width='1.8' stroke-linejoin='round'></path>"

        svg.setAttribute("viewBox", "0 0 " + width + " " + height)
        svg.innerHTML = clipTo("luckClip", pad, width, height)
            + clipTo("luckAbove", {left: pad.left, right: pad.right, top: pad.top, bottom: height - zero + LUCK_EVEN_PX}, width, height)
            + clipTo("luckBelow", {left: pad.left, right: pad.right, top: zero + LUCK_EVEN_PX, bottom: pad.bottom}, width, height)
            + grid + axis.markup
            + "<g clip-path='url(#luckClip)'>"
            + "<path d='" + band(3) + "' fill='rgba(154, 161, 177, .05)'></path>"
            + "<path d='" + band(2) + "' fill='rgba(154, 161, 177, .08)'></path>"
            + "<path d='" + band(1) + "' fill='rgba(154, 161, 177, .14)'></path>"
            + horizontal(pad, width, zero.toFixed(1))
            + lineIn("var(--dim)") + lineIn("var(--up)", "luckAbove") + lineIn("var(--down)", "luckBelow")
            + "</g>"
            + hairLine("luckHair", pad, height)

        const summary = divided([number(last.count) + " flips", Math.round(wins / last.count * 100) + "% won",
            signed(last.net) + " points", sigmas(last.net / last.spread) + " " + verdict(last.net / last.spread)])
        readout.innerHTML = summary
        legend.innerHTML = "<span><i style='background: var(--up)'></i>Ahead on flips</span>"
            + "<span><i style='background: var(--down)'></i>Behind on flips</span>"
            + "<span><i style='background: rgba(154, 161, 177, .45)'></i>Ordinary luck, within 1\u03c3 <span class='faint'>" + LUCK_COVERAGE[1] + "</span></span>"
            + "<span><i style='background: rgba(154, 161, 177, .26)'></i>Unusual but possible, within 2\u03c3 <span class='faint'>" + LUCK_COVERAGE[2] + "</span></span>"
            + "<span><i style='background: rgba(154, 161, 177, .12)'></i>Rare, within 3\u03c3 <span class='faint'>" + LUCK_COVERAGE[3] + "</span></span>"

        attachNavigation({
            key: "luck", svg: svg, whole: whole, width: width, height: height, pad: pad, redraw: drawLuckTimeline,
            hover: clientX => {
                const box = svg.getBoundingClientRect()
                const ratio = ((clientX - box.left) / box.width * width - pad.left) / Math.max(1, width - pad.left - pad.right)
                const time = span[0] + ratio * (span[1] - span[0])
                let nearest = drawn[0]
                drawn.forEach(point => { if (Math.abs(point.t - time) < Math.abs(nearest.t - time)) nearest = point })
                moveHair("luckHair", axis.toX(nearest.t).toFixed(1))
                readout.innerHTML = divided([longDay(nearest.t), number(nearest.count) + " flips so far",
                    signed(nearest.net) + " points", sigmas(nearest.net / nearest.spread)])
            },
            leave: () => {
                hideHair("luckHair")
                readout.innerHTML = summary
            },
        })
    }

    const drawLuck = () => {
        drawPeriodStrip("luck")
        const single = singleSubject()
        document.getElementById("luckRows").hidden = single
        document.getElementById("luckNote").hidden = single
        document.getElementById("luckSingle").hidden = !single

        if (state.mode === "person") {
            setHead("luck", nameHtml(state.person) + "'s flip luck", "The running total of " + nameText(state.person)
                + "'s flips" + (state.period === null ? "" : " in the chosen period") + ". The shaded bands are \u00b11\u03c3, \u00b12\u03c3 and \u00b13\u03c3, where a fair coin would normally leave them.")
            drawLuckTimeline()
            return
        }
        if (state.mode === "server") {
            setHead("luck", "Server flip luck", "The running total of every flip on the server" + (state.period === null ? "" : " in the chosen period") + ". The shaded bands are \u00b11\u03c3, \u00b12\u03c3 and \u00b13\u03c3, where a fair coin would normally leave it.")
            drawLuckTimeline()
            return
        }
        setHead("luck", state.mode === "some" ? "Flip luck: " + chosenTitle()
            : state.mode === "top" ? "Flip luck: top " + topMembers().length + " by " + topPhrase() : "Flip luck",
            "Every flip is a fair 50/50, so everyone should break even over time. Within \u00b11\u03c3 is ordinary; beyond \u00b12\u03c3 is rare.")

        const measured = selectedMembers().map(person => ({person: person, luck: luckOf(person)}))
        const rows = measured.filter(row => row.luck.flips >= MIN_LUCK_FLIPS).sort((a, b) => b.luck.z - a.luck.z)
        const skipped = measured.filter(row => row.luck.flips > 0 && row.luck.flips < MIN_LUCK_FLIPS).length
        const at = z => 50 + Math.max(-LUCK_RANGE, Math.min(LUCK_RANGE, z)) / LUCK_RANGE * 50

        const scale = "<div class='luckRow'><div></div><div class='luckScale'></div><div></div><div></div></div>"

        document.getElementById("luckRows").innerHTML = scale + rows.map(row => {
            const z = row.luck.z
            return "<div class='luckRow'>"
                + "<div class='srcName'>" + who(row.person) + "</div>"
                + "<div class='luckBar'><div class='luckFill " + (z >= 0 ? "lucky" : "unlucky") + "' style='left:" + Math.min(50, at(z)).toFixed(3)
                + "%; width:" + Math.abs(at(z) - 50).toFixed(3) + "%'></div></div>"
                + "<div class='luckValue'>" + toned(sigmas(z)) + " <span class='faint'>" + verdict(z) + "</span></div>"
                + "<div class='luckDetail'>"
                + "<span>" + number(row.luck.flips) + " flips</span>"
                + "<span>" + number(row.luck.wins) + (row.luck.wins === 1 ? " win" : " wins") + "</span>"
                + "<span>" + number(row.luck.losses) + (row.luck.losses === 1 ? " loss" : " losses") + "</span>"
                + "<span>" + toned(signed(row.luck.net)) + "</span>"
                + "</div>"
                + "</div>"
        }).join("")

        const scaleBox = document.querySelector("#luckRows .luckScale")
        const perSigma = scaleBox.clientWidth / (2 * LUCK_RANGE)
        const ticks = perSigma >= 34 ? [-3, -2, -1, 0, 1, 2, 3] : perSigma >= 12 ? [-3, 0, 3] : [0]
        scaleBox.innerHTML = ticks.map(z => "<span style='left:" + at(z) + "%'>" + (z > 0 ? "+" : "") + z + "σ"
            + "<small>" + LUCK_COVERAGE[Math.abs(z)] + "</small></span>").join("")

        const when = state.period === null ? "" : " in this period"
        document.getElementById("luckNote").textContent = rows.length === 0
            ? (state.period === null ? "Nobody here has enough flips yet to measure." : "Nobody here has enough flips in this period to measure.")
            : skipped ? skipped + (skipped === 1 ? " member has" : " members have") + " fewer than " + MIN_LUCK_FLIPS + " flips" + when + ", too few to judge, so they aren't shown." : ""
    }

    const economies = new Map()
    const economySeries = () => {
        const key = viewKey()
        if (economies.has(key)) return economies.get(key)
        const series = people.map(person => viewOf(person).points)
        const filled = series.filter(points => points.length > 0)
        const economy = {
            series: series,
            members: filled.length,
            whole: [Math.min(...filled.map(points => points[0].t)), Math.max(...filled.map(points => points[points.length - 1].t))],
        }
        economies.set(key, economy)
        return economy
    }
    const sampleEconomy = (count, from, to, extra) => {
        const {series} = economySeries()
        const cursor = series.map(points => lastAtOrBefore(points, from))
        const samples = []
        const times = Array.from({length: count}, (unused, step) => from + (to - from) * step / (count - 1))
            .concat((extra || []).filter(time => time > from && time < to))
            .sort((a, b) => a - b)

        for (const at of times) {
            const balances = series.map((points, index) => {
                while (cursor[index] + 1 < points.length && points[cursor[index] + 1].t <= at) cursor[index]++
                return cursor[index] === -1 ? null : points[cursor[index]].v
            })
            const standing = index => balances[index] === null ? 0 : balances[index]
            const order = balances.map((balance, index) => index)
                .sort((a, b) => standing(b) - standing(a) || a - b)
            const held = order.map(index => Math.max(0, standing(index)))
            const total = held.reduce((sum, balance) => sum + balance, 0)
            const shareOf = size => total ? held.slice(0, size).reduce((sum, balance) => sum + balance, 0) / total : 0
            const ranks = balances.map(() => 0)
            let place = 0
            let last = null
            order.forEach((index, position) => {
                if (last === null || standing(index) !== last) {
                    place = position + 1
                    last = standing(index)
                }
                ranks[index] = place
            })
            samples.push({at: at, balances: balances, total: total, order: order, ranks: ranks,
                tied: order.filter(index => standing(index) === 0).length,
                shares: CONCENTRATION_BANDS.map(band => shareOf(band.size))})
        }
        return samples
    }
    const shareOfMember = (sample, member) => sample.total && sample.balances[member] !== null
        ? Math.max(0, sample.balances[member]) / sample.total
        : null

    const drawConcentration = () => {
        const svg = document.getElementById("concentrationChart")
        const readout = document.getElementById("concentrationReadout")
        const legend = document.getElementById("concentrationLegend")
        const {whole} = economySeries()
        const span = state.ranges.concentration || whole
        const samples = sampleEconomy(CONCENTRATION_SAMPLES, span[0], span[1])
        const latest = samples[samples.length - 1]
        const width = svg.parentElement.clientWidth || 900
        const height = svg.parentElement.clientHeight || 460
        const pad = {left: 52, right: 16, top: 12, bottom: 24}
        const axis = timeAxis(span[0], span[1], width, height, pad)
        const member = state.mode === "person" ? memberIndex(state.person) : null
        const ceiling = 1
        const toY = share => height - pad.bottom - Math.min(share, ceiling) / ceiling * (height - pad.bottom - pad.top)
        const x = sample => axis.toX(sample.at).toFixed(1)

        const grid = [0, .25, .5, .75, 1].map(fraction => {
            const y = toY(fraction * ceiling).toFixed(1)
            return horizontal(pad, width, y) + leftLabel(pad, y, percent(fraction * ceiling))
        }).join("")

        let body = ""
        let describe = null

        if (member !== null) {
            setHead("concentration", nameHtml(state.person) + "'s share of all points",
                "How much of the server's points " + nameText(state.person) + " held over time. Hover to see their share and rank at any moment.")
            const runs = []
            let run = []
            samples.forEach(sample => {
                const share = shareOfMember(sample, member)
                if (share === null) {
                    if (run.length) runs.push(run)
                    run = []
                    return
                }
                run.push({sample: sample, share: share})
            })
            if (run.length) runs.push(run)
            body = runs.map(points => {
                const line = points.map((point, index) => (index ? "L" : "M") + x(point.sample) + " " + toY(point.share).toFixed(1)).join(" ")
                const area = line + " L" + x(points[points.length - 1].sample) + " " + toY(0) + " L" + x(points[0].sample) + " " + toY(0) + " Z"
                return "<path d='" + area + "' fill='rgba(122, 162, 247, .30)'></path>"
                    + "<path d='" + line + "' fill='none' stroke='" + ACCENT + "' stroke-width='1.8' stroke-linejoin='round'></path>"
            }).join("")
            describe = sample => {
                const share = shareOfMember(sample, member)
                return [longDay(sample.at)].concat(share === null ? ["Not active yet"]
                    : [percent(share) + " of all points", "Rank " + sample.ranks[member] + " of " + sample.order.length])
            }
            legend.innerHTML = "<span><i style='background:" + ACCENT + "'></i>" + nameHtml(state.person) + "</span>"
        } else if (state.mode === "top" || state.mode === "some") {
            const members = selectedMembers().map(memberIndex)
                .sort((a, b) => (shareOfMember(latest, b) || 0) - (shareOfMember(latest, a) || 0))
            setHead("concentration", state.mode === "some" ? chosenTitle() + " share of all points"
                : "Share of all points: top " + members.length + " by " + topPhrase(),
                (state.mode === "some" ? "Each selected member's" : "Each of the top " + members.length + " members'")
                + " share of the server's points over time, stacked, with everyone else above them. Hover to see the split at any moment.")
            const edges = samples.map(sample => {
                let running = 0
                return members.map(index => {
                    const low = running
                    running += shareOfMember(sample, index) || 0
                    return {low: low, high: running}
                }).concat([{low: running, high: Math.max(running, 1)}])
            })
            const layer = layerIndex => samples.map((sample, step) => (step ? "L" : "M") + x(sample) + " " + toY(edges[step][layerIndex].high).toFixed(1)).join(" ")
                + " " + samples.map((sample, step) => ({sample: sample, step: step})).reverse()
                    .map(entry => "L" + x(entry.sample) + " " + toY(edges[entry.step][layerIndex].low).toFixed(1)).join(" ") + " Z"
            body = members.map((index, place) => "<path d='" + layer(place) + "' fill='" + PALETTE[place % PALETTE.length]
                + "' fill-opacity='.75' data-hover='" + hoverAttr(nameText(people[index])) + "'></path>").join("")
                + "<path d='" + layer(members.length) + "' fill='rgba(154, 161, 177, .12)' data-hover='Everyone else'></path>"
            describe = sample => {
                const split = members.map(index => ({index: index, share: shareOfMember(sample, index) || 0}))
                    .sort((a, b) => b.share - a.share)
                const rest = Math.max(0, 1 - split.reduce((sum, entry) => sum + entry.share, 0))
                return [longDay(sample.at)].concat(split.slice(0, 4).map(entry => nameText(people[entry.index]) + " " + percent(entry.share)))
                    .concat(["Everyone else " + percent(rest)])
            }
            legend.innerHTML = members.map((index, place) => "<span><i style='background:" + PALETTE[place % PALETTE.length] + "'></i>"
                + nameHtml(people[index]) + "</span>").join("")
                + "<span><i style='background: rgba(154, 161, 177, .35)'></i>Everyone else</span>"
        } else {
            setHead("concentration", "Wealth concentration", "The share of all points held by the richest 1, 3 and 10 members over time. Hover to see who was on top.")
            body = CONCENTRATION_BANDS.map((band, index) => {
                const line = samples.map((sample, step) => (step ? "L" : "M") + x(sample) + " " + toY(sample.shares[index]).toFixed(1)).join(" ")
                const area = line + " L" + axis.toX(span[1]).toFixed(1) + " " + toY(0) + " L" + axis.toX(span[0]).toFixed(1) + " " + toY(0) + " Z"
                return "<path d='" + area + "' fill='" + band.fill + "'></path>"
                    + "<path d='" + line + "' fill='none' stroke='" + band.stroke + "' stroke-width='1.6' stroke-linejoin='round'></path>"
            }).join("")
            describe = sample => [longDay(sample.at)]
                .concat(CONCENTRATION_BANDS.map((band, index) => band.label + " " + percent(sample.shares[index])).reverse())
                .concat(sample.order.length ? ["On top: " + nameText(people[sample.order[0]])] : [])
            legend.innerHTML = CONCENTRATION_BANDS.slice().reverse()
                .map(band => "<span><i style='background:" + band.stroke + "'></i>" + band.label + "</span>").join("")
        }

        svg.setAttribute("viewBox", "0 0 " + width + " " + height)
        svg.innerHTML = clipTo("concentrationClip", pad, width, height) + grid + axis.markup
            + "<g clip-path='url(#concentrationClip)'>" + body + "</g>" + hairLine("concentrationHair", pad, height)
        readout.innerHTML = divided(describe(latest))

        attachNavigation({
            key: "concentration", svg: svg, whole: whole, width: width, height: height, pad: pad, redraw: drawConcentration,
            hover: clientX => {
                const sample = samples[sampleAt(svg, clientX, width, pad, samples.length)]
                moveHair("concentrationHair", x(sample))
                readout.innerHTML = divided(describe(sample))
            },
            leave: () => {
                hideHair("concentrationHair")
                readout.innerHTML = divided(describe(latest))
            },
        })
    }

    const drawRankings = () => {
        const svg = document.getElementById("rankingsChart")
        const readout = document.getElementById("rankingsReadout")
        const economy = economySeries()
        const span = state.ranges.rankings || economy.whole
        const era = state.hideRecovered ? null : eraAt
        const firstSeen = economy.series.map(points => points.length ? points[0].t : null)
        const addedAtEra = era === null ? [] : firstSeen.filter(time => time !== null && time >= era && time - era <= ERA_JOIN_MS)
        const eraSettled = addedAtEra.length ? Math.max(...addedAtEra) : era
        const samples = sampleEconomy(RANKING_SAMPLES, span[0], span[1], era === null ? [] : [era - 1, eraSettled])
        const latest = samples[samples.length - 1]
        const capped = state.mode === "top"
        const capLanes = state.topCount + 1
        const single = state.mode === "person"
        const member = single ? memberIndex(state.person) : null
        const population = Math.max(2, ...samples.map(sample => Math.max(...sample.ranks)))
        const worst = single ? Math.max(1, ...samples.map(sample => sample.ranks[member] || 0)) : 0
        const fittedFloor = capped ? capLanes
            : single ? worst + Math.max(1, Math.ceil(worst * RANK_BUFFER_SHARE))
            : population
        const floorRank = !capped && holdingScale("rankings") && heldScales.rankings ? Math.max(heldScales.rankings, fittedFloor) : fittedFloor
        heldScales.rankings = floorRank
        const byLatestRank = (a, b) => (latest.ranks[a] || floorRank + 1) - (latest.ranks[b] || floorRank + 1)
        const tracked = single ? [member]
            : capped ? topMembers().map(memberIndex)
            : state.mode === "some" ? chosenMembers().map(memberIndex)
            : people.map(memberIndex).filter(index => samples.some(sample => sample.ranks[index])).sort(byLatestRank)

        const width = svg.parentElement.clientWidth || 900
        const height = svg.parentElement.clientHeight || 460
        const labelled = capped || single || (height - 38) / Math.max(1, floorRank - 1) >= MIN_LABEL_GAP_PX
        const pad = {left: 44, right: labelled ? 150 : 24, top: 14, bottom: 24}
        const plotHeight = height - pad.top - pad.bottom
        const axis = timeAxis(span[0], span[1], width, height, pad)
        const toY = rank => pad.top + (Math.min(rank, floorRank) - 1) / (floorRank - 1) * plotHeight
        const dotRadius = single ? 4 : labelled ? 3.5 : Math.max(1.2, Math.min(3.5, plotHeight / (floorRank - 1) / 2))
        const eraX = era !== null && era > span[0] && era < span[1] ? axis.toX(era) : null

        if (single) {
            setHead("rankings", nameHtml(state.person) + "'s rank over time", "Where " + nameText(state.person) + " placed among all members over time. Hover to see their rank at any moment.")
        } else if (capped) {
            setHead("rankings", "Leaderboard over time", "Rank history for the top " + tracked.length
                + " by " + topPhrase() + ". A line drops into the bottom lane while that member is outside the top " + state.topCount
                + ". Hover a line or name to follow one member, and hover anywhere to see the standings at that moment.")
        } else if (state.mode === "some") {
            setHead("rankings", chosenTitle() + " rank over time", "Rank history for " + tracked.length
                + " selected members, placed among everyone. Members with no points yet share last place"
                + (addedAtEra.length ? ", so the " + addedAtEra.length + " with no history before BCE climb out of that tie when live tracking begins" : "")
                + ". Hover a line to follow one member, and hover anywhere to see the standings at that moment.")
        } else {
            setHead("rankings", "Every member's rank over time", "Rank history for all " + tracked.length
                + " members. Members with no points yet count as zero and share last place"
                + (addedAtEra.length ? ", so the " + addedAtEra.length + " with no history before BCE climb out of that tie when live tracking begins" : "")
                + ". Hover a line to follow one member, and hover anywhere to see the standings at that moment.")
        }

        let laneRanks = Array.from({length: capLanes}, (unused, index) => index + 1)
        if (!capped) {
            const step = Math.max(1, Math.round(niceStep(floorRank - 1, Math.max(2, Math.round(plotHeight / RANK_TICK_GAP_PX)))))
            const limit = Math.min(floorRank, population)
            laneRanks = [1]
            for (let rank = step === 1 ? 2 : step; rank <= limit; rank += step) laneRanks.push(rank)
            if (limit - laneRanks[laneRanks.length - 1] >= step / 2) laneRanks.push(limit)
        }
        const laneMarkup = laneRanks.map(rank => {
            const y = toY(rank).toFixed(1)
            return horizontal(pad, width, y) + leftLabel(pad, y, capped && rank === capLanes ? capLanes + "+" : "#" + rank)
        }).join("")

        const eraMarker = eraX === null ? ""
            : "<line class='era' x1='" + eraX.toFixed(1) + "' x2='" + eraX.toFixed(1) + "' y1='" + pad.top + "' y2='" + (height - pad.bottom) + "'></line>"
                + (eraX - pad.left < 24
                    ? "<text class='eraLabel' x='" + (eraX + 4).toFixed(1) + "' y='" + (pad.top + 10) + "'>BCE</text>"
                    : "<text class='eraLabel' text-anchor='end' x='" + (eraX - 4).toFixed(1) + "' y='" + (pad.top + 10) + "'>BCE</text>")

        const lines = tracked.map((index, place) => {
            const colour = single ? ACCENT : PALETTE[place % PALETTE.length]
            let inside = ""
            let outside = ""
            for (let step = 1; step < samples.length; step++) {
                const before = samples[step - 1].ranks[index]
                const after = samples[step].ranks[index]
                if (!before || !after) continue
                const piece = "M" + axis.toX(samples[step - 1].at).toFixed(1) + " " + toY(before).toFixed(1)
                    + "L" + axis.toX(samples[step].at).toFixed(1) + " " + toY(after).toFixed(1)
                const recount = era !== null && samples[step - 1].at < era && samples[step].at >= era
                if (recount || (capped && (before >= capLanes || after >= capLanes))) outside += piece
                else inside += piece
            }
            const endRank = latest.ranks[index]
            const outsideTop = capped && endRank >= capLanes
            const left = people[index]
            const shown = nameText(left)
            const name = shown.length > 18 ? shown.slice(0, 17) + "\u2026" : shown
            const end = !endRank ? "" : "<circle cx='" + axis.toX(span[1]).toFixed(1) + "' cy='" + toY(endRank).toFixed(1) + "' r='" + dotRadius.toFixed(1) + "' fill='" + colour + "'></circle>"
                + (labelled && !outsideTop ? "<text x='" + (axis.toX(span[1]) + 10).toFixed(1) + "' y='" + (toY(endRank) + 4).toFixed(1)
                    + "' fill='" + (departed(left) ? "#7d8492" : colour) + "'" + (departed(left) ? " text-decoration='line-through'" : "")
                    + " font-size='12'>" + escape(name) + "</text>" : "")
            return "<g class='rank' data-hover='" + hoverAttr(shown) + "'>"
                + "<path class='hit' d='" + inside + outside + "'></path>"
                + (outside ? "<path d='" + outside + "' fill='none' stroke='" + colour + "' stroke-width='1.4' opacity='.5'></path>" : "")
                + "<path d='" + inside + "' fill='none' stroke='" + colour + "' stroke-width='" + (single ? 2.6 : capped ? 2.2 : 1.5) + "' stroke-linejoin='round'></path>"
                + end + "</g>"
        }).join("")

        const belowTop = capped ? tracked.filter(index => latest.ranks[index] >= capLanes).length : 0
        const overflowLabel = belowTop === 0 ? ""
            : "<text class='axis' x='" + (axis.toX(span[1]) + 10).toFixed(1) + "' y='" + (toY(capLanes) + 4).toFixed(1) + "'>"
                + belowTop + " outside the top " + state.topCount + "</text>"

        svg.setAttribute("viewBox", "0 0 " + width + " " + height)
        svg.innerHTML = laneMarkup + axis.markup + lines + eraMarker + overflowLabel + hairLine("rankingsHair", pad, height)

        const describe = sample => [longDay(sample.at)].concat(single
            ? [(sample.ranks[member] ? "Rank " + sample.ranks[member] + " of " + sample.order.length : "Not ranked yet")
                + (sample.ranks[member] && sample.tied > 1 && sample.ranks[member] === sample.order.length - sample.tied + 1 ? ", tied with " + (sample.tied - 1) + " others" : "")]
            : (capped ? [] : [sample.order.length + " members ranked"]
                .concat(sample.tied > 1 ? [sample.tied + " tied at 0 points"] : []))
                .concat(sample.order.slice(0, 5).map((index, place) => (place + 1) + ". " + nameText(people[index]))))
        readout.innerHTML = divided(describe(latest))

        attachNavigation({
            key: "rankings", svg: svg, whole: economy.whole, width: width, height: height, pad: pad, redraw: drawRankings,
            hover: clientX => {
                const box = svg.getBoundingClientRect()
                const time = span[0] + ((clientX - box.left) / box.width * width - pad.left) / Math.max(1, width - pad.left - pad.right) * (span[1] - span[0])
                const sample = samples.reduce((nearest, candidate) => Math.abs(candidate.at - time) < Math.abs(nearest.at - time) ? candidate : nearest)
                moveHair("rankingsHair", axis.toX(sample.at).toFixed(1))
                readout.innerHTML = divided(describe(sample))
            },
            leave: () => {
                hideHair("rankingsHair")
                readout.innerHTML = divided(describe(latest))
            },
        })
    }

    const VIEW_DRAWERS = {
        history: () => {
            drawStats()
            drawChart()
            applyFilters()
        },
        sources: drawSources,
        luck: drawLuck,
        concentration: drawConcentration,
        rankings: drawRankings,
    }
    const viewPanels = Array.from(document.querySelectorAll(".view"))
    const tabs = Array.from(document.querySelectorAll(".tab"))
    let activeView = "history"
    const eventsCard = document.getElementById("eventsCard")
    const drawActiveView = () => {
        VIEW_DRAWERS[activeView]()
        if (activeView === "sources" || activeView === "luck") applyFilters()
    }
    const showView = name => {
        activeView = name
        tabs.forEach(tab => { tab.className = tab.dataset.view === name ? "tab on" : "tab" })
        viewPanels.forEach(panel => { panel.hidden = panel.dataset.view !== name })
        const slot = document.getElementById(name + "Events")
        if (slot) slot.appendChild(eventsCard)
        drawActiveView()
    }
    tabs.forEach(tab => { tab.onclick = () => showView(tab.dataset.view) })
    const scaleButtons = Array.from(document.querySelectorAll("[data-scale]"))
    scaleButtons.forEach(button => {
        button.onclick = () => {
            sourcesScale = button.dataset.scale
            scaleButtons.forEach(other => { other.className = other === button ? "tool on" : "tool" })
            drawSources()
        }
    })
    window.addEventListener("resize", () => {
        if (activeView !== "history") VIEW_DRAWERS[activeView]()
    })

    refreshSortHeads()
    drawMeta()
    drawPeople()
    drawStats()
    drawChart()
    applyFilters()
}

const GATE_TITLES = {
    401: "You need a new link",
    429: "Too many requests",
    503: "The bot is still starting up",
}

const failed = (error) => {
    document.querySelector("header").hidden = true
    document.querySelector(".layout").hidden = true
    document.getElementById("gateTitle").textContent = GATE_TITLES[error.status] || "Could not load the point history"
    const body = document.getElementById("gateBody")
    if (error.status === 401) {
        body.innerHTML = "Your link has expired or was already opened. Run <code>!history</code> in Discord for a new one."
    } else {
        body.textContent = error.message
    }
    document.getElementById("gate").hidden = false
}

const refused = (response) => response.text()
    .catch(() => "")
    .then(message => Promise.reject(Object.assign(
        new Error(message || response.status + " from " + response.url), {status: response.status})))

const linkToken = () => {
    const found = /(?:^|&)t=([^&]+)/.exec(location.hash.slice(1))
    if (found === null) return undefined

    history.replaceState(null, "", location.pathname + location.search)
    return decodeURIComponent(found[1])
}

const signIn = (token) => token === undefined
    ? Promise.resolve()
    : fetch(SESSION_ROUTE, {method: "POST", headers: {"Authorization": "Bearer " + token}})
        .then(response => response.ok ? undefined : refused(response))

signIn(linkToken())
    .then(() => fetch(POINT_HISTORY_ROUTE))
    .then(response => response.ok ? response.json() : refused(response))
    .then(start)
    .catch(failed)
</script>
</body>
</html>
